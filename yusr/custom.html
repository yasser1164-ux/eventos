<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اطلب تفصيل | يسر</title>
<meta name="description" content="أرسل قياساتك وتفاصيل القطعة التي تريدها، ونرد عليك بالسعر خلال 24 ساعة عمل.">
<meta name="theme-color" content="#4A3728">
<meta property="og:type" content="website">
<meta property="og:site_name" content="يسر | Yusr">
<meta property="og:url" content="https://yasser1164-ux.github.io/eventos/yusr/custom.html">
<!-- TODO: confirm — replace with a real 1200x630 og.png share image -->
<meta property="og:image" content="https://yasser1164-ux.github.io/eventos/yusr/assets/logo.svg">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://yasser1164-ux.github.io/eventos/yusr/custom.html">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="custom">
<div id="header-slot"></div>

<main id="main">
  <section class="section section--tight">
    <div class="container" style="max-width:820px">
      <div class="section__head">
        <h1 data-i18n="custom.title"></h1>
        <p data-i18n="custom.lead"></p>
      </div>

      <div class="notice" id="prefill-notice" hidden>
        <p><span data-i18n="custom.prefilled"></span> <strong id="prefill-product"></strong></p>
      </div>

      <div class="notice notice--warn" id="form-error-summary" role="alert" hidden style="margin-block:16px">
        <p data-i18n="custom.errorSummary"></p>
      </div>

      <form class="form" id="request-form" novalidate>
        <input type="hidden" id="f-product-name" name="product">

        <!-- --------------------------------------------------- contact -- -->
        <fieldset class="form__section">
          <legend data-i18n="custom.section1"></legend>

          <div class="form__grid">
            <p class="field">
              <label class="field__label" for="f-name" data-i18n="form.name"></label>
              <input class="field__input" type="text" id="f-name" name="name" autocomplete="name"
                     required aria-describedby="e-name" data-i18n-attr="placeholder:form.namePh">
              <span class="field__error" id="e-name" hidden></span>
            </p>

            <p class="field">
              <label class="field__label" for="f-city" data-i18n="form.city"></label>
              <select class="field__input" id="f-city" name="city" required aria-describedby="e-city"></select>
              <span class="field__error" id="e-city" hidden></span>
            </p>

            <p class="field">
              <label class="field__label" for="f-phone" data-i18n="form.phone"></label>
              <input class="field__input" type="tel" id="f-phone" name="phone" inputmode="tel" dir="ltr"
                     autocomplete="tel" required aria-describedby="h-phone e-phone"
                     data-i18n-attr="placeholder:form.phonePh">
              <span class="field__hint" id="h-phone" data-i18n="form.phoneHint"></span>
              <span class="field__error" id="e-phone" hidden></span>
            </p>

            <p class="field">
              <label class="field__label" for="f-time" data-i18n="form.contactTime"></label>
              <select class="field__input" id="f-time" name="time"></select>
            </p>
          </div>
        </fieldset>

        <!-- ----------------------------------------------------- piece -- -->
        <fieldset class="form__section">
          <legend data-i18n="custom.section2"></legend>

          <div class="form__grid">
            <p class="field">
              <label class="field__label" for="f-category" data-i18n="form.category"></label>
              <select class="field__input" id="f-category" name="category" required aria-describedby="e-category"></select>
              <span class="field__error" id="e-category" hidden></span>
            </p>

            <p class="field">
              <label class="field__label" for="f-budget" data-i18n="form.budget"></label>
              <select class="field__input" id="f-budget" name="budget"></select>
            </p>

            <p class="field field--full">
              <label class="field__label" for="f-description" data-i18n="form.description"></label>
              <textarea class="field__input" id="f-description" name="description" rows="4" required
                        aria-describedby="e-description" data-i18n-attr="placeholder:form.descriptionPh"></textarea>
              <span class="field__error" id="e-description" hidden></span>
            </p>

            <div class="field field--full">
              <span class="field__label" id="dims-label" data-i18n="form.dims"></span>
              <div class="dims" role="group" aria-labelledby="dims-label">
                <span class="field">
                  <label class="field__label" for="f-width" data-i18n="form.width"></label>
                  <input class="field__input" type="number" id="f-width" name="width" min="1" max="2000" inputmode="numeric" dir="ltr">
                </span>
                <span class="field">
                  <label class="field__label" for="f-depth" data-i18n="form.depth"></label>
                  <input class="field__input" type="number" id="f-depth" name="depth" min="1" max="2000" inputmode="numeric" dir="ltr">
                </span>
                <span class="field">
                  <label class="field__label" for="f-height" data-i18n="form.height"></label>
                  <input class="field__input" type="number" id="f-height" name="height" min="1" max="2000" inputmode="numeric" dir="ltr">
                </span>
              </div>
              <span class="field__hint" data-i18n="form.dimsHint"></span>
            </div>

            <p class="field">
              <label class="field__label" for="f-material" data-i18n="form.materialPref"></label>
              <input class="field__input" type="text" id="f-material" name="material"
                     data-i18n-attr="placeholder:form.materialPh">
            </p>

            <p class="field">
              <label class="field__label" for="f-ref">
                <span data-i18n="form.ref"></span>
              </label>
              <input class="field__input" type="url" id="f-ref" name="ref" dir="ltr"
                     aria-describedby="e-ref" data-i18n-attr="placeholder:form.refPh">
              <span class="field__error" id="e-ref" hidden></span>
            </p>
          </div>
        </fieldset>

        <div class="form__actions">
          <button type="submit" class="btn btn--primary">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm4.52 12c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.24-.64.8-.79.97-.14.16-.29.18-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.71-.14-.25-.01-.38.11-.5.11-.11.25-.29.37-.43.12-.15.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43h-.47c-.17 0-.43.06-.66.31-.22.25-.87.85-.87 2.07s.9 2.4 1.02 2.56c.12.17 1.76 2.67 4.25 3.74.6.26 1.06.41 1.42.52.6.19 1.14.16 1.57.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.08.15-1.18-.06-.11-.23-.17-.48-.29Z"/></svg>
            <span data-i18n="custom.submit"></span>
          </button>
        </div>
      </form>

      <!-- --------------------------------------------------- success -- -->
      <div class="success" id="form-success" hidden>
        <span class="success__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9.5 17.2 4.8 12.5l1.4-1.4 3.3 3.3 8-8 1.4 1.4-9.4 9.4Z"/></svg></span>
        <h2 tabindex="-1" data-i18n="custom.successTitle"></h2>
        <p data-i18n="custom.successText"></p>
        <div class="btn-row">
          <a class="btn btn--primary" id="success-wa" href="#" target="_blank" rel="noopener"><span data-i18n="custom.openWa"></span></a>
          <a class="btn btn--ghost" id="success-mail" href="#"><span data-i18n="custom.openMail"></span></a>
        </div>
        <p style="margin-block-start:16px">
          <button type="button" class="btn btn--ghost btn--sm" id="form-again"><span data-i18n="custom.again"></span></button>
        </p>
      </div>
    </div>
  </section>
</main>

<div id="footer-slot"></div>

<script type="module" src="js/main.js"></script>
<script type="module" src="js/form.js"></script>
</body>
</html>
