<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eventos — What's happening near you</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=c43ee830" />
</head>
<body class="home-body">
  <header class="home-head">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">Eventos</span>
    </div>
    <span class="home-city" id="home-city">Eastern Province</span>
  </header>

  <main class="home-main">
    <input class="home-search" id="home-search" type="search"
           placeholder="Search events and places…" autocomplete="off" />

    <!-- search results (only while typing) -->
    <section class="home-row" id="row-results" hidden>
      <h2>Results</h2>
      <div class="home-scroll" id="scroll-results"></div>
      <p class="home-empty" id="results-empty" hidden>Nothing matches that.</p>
    </section>

    <section class="home-row" id="row-tonight" hidden>
      <h2>Happening tonight</h2>
      <div class="home-scroll" id="scroll-tonight"></div>
    </section>

    <section class="home-row" id="row-weekend" hidden>
      <h2>This weekend</h2>
      <div class="home-scroll" id="scroll-weekend"></div>
    </section>

    <section class="home-row" id="row-places" hidden>
      <h2>Places to go anytime</h2>
      <div class="home-scroll" id="scroll-places"></div>
    </section>

    <div class="home-actions">
      <a class="home-action" href="map.html">🗺️ Open map</a>
      <a class="home-action" href="ar.html">📸 AR view</a>
    </div>
  </main>

  <!-- detail card (same content as the map popup) -->
  <div class="ar-card" id="home-card" hidden>
    <button class="ar-card-close" id="home-card-close">✕</button>
    <div id="home-card-body"></div>
  </div>

<script src="config.js?v=c43ee830"></script>
<script src="seed.js?v=c43ee830"></script>
<script src="posters.js?v=c43ee830"></script>
<script src="data.js?v=c43ee830"></script>
<script src="home.js?v=c43ee830"></script>
</body>
</html>
