<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eventos — What's happening near you</title>
<!-- ALL-IN-ONE version: styles + data + logic packed into this single file,
     so it can be uploaded to Netlify Drop as one file and just work. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{--bg:#0f1220;--panel:#171b2e;--panel-2:#1e2340;--text:#eef1f8;--muted:#9aa3c0;--accent:#ff5a5f;--accent-2:#6c5ce7;--line:#262c48;--radius:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;overflow:hidden}
.topbar{height:60px;display:flex;align-items:center;gap:14px;padding:0 20px;background:rgba(23,27,46,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand-dot{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ff8a8d,var(--accent));box-shadow:0 0 16px var(--accent)}
.brand-name{font-weight:800;font-size:20px;letter-spacing:-.02em}
.tagline{color:var(--muted);font-size:13px}
.layout{display:flex;height:calc(100vh - 60px);height:calc(100dvh - 60px)}
.sidebar{width:360px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
.sidebar-head{padding:16px 18px 10px}
.sidebar-head h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.sidebar-head p{color:var(--muted);font-size:13px;margin-top:3px}
.event-list{overflow-y:auto;padding:6px 12px 18px;-webkit-overflow-scrolling:touch}
.event-card{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:13px;margin-bottom:10px;cursor:pointer;transition:transform .15s ease,border-color .15s ease}
.event-card:hover{transform:translateY(-2px);border-color:var(--accent-2)}
.event-card.active{border-color:var(--accent)}
.event-card .cat{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:5px}
.event-card h3{font-size:15px;font-weight:600}
.event-card .meta{color:var(--muted);font-size:13px;margin-top:5px}
.event-card .buy{display:inline-block;margin-top:10px;padding:8px 14px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:13px;font-weight:600;text-decoration:none}
.map-wrap{flex:1;position:relative}
#map{position:absolute;inset:0;background:#0b0e18}
.pin{width:34px;height:34px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 4px 14px rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.85)}
.pin span{transform:rotate(45deg);font-size:15px}
.leaflet-popup-content-wrapper{background:var(--panel-2);color:var(--text);border-radius:12px}
.leaflet-popup-tip{background:var(--panel-2)}
.popup h3{font-size:15px;margin-bottom:4px}
.popup .meta{color:var(--muted);font-size:13px}
.popup a{display:inline-block;margin-top:10px;padding:7px 12px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;text-decoration:none;font-size:13px;font-weight:600}
@media (max-width:720px){
  .layout{flex-direction:column-reverse}
  .sidebar{width:100%;height:45%;border-right:none;border-top:1px solid var(--line)}
  .map-wrap{height:55%}
  .tagline{display:none}
}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">Eventos</span>
    </div>
    <div class="tagline">What's happening near you</div>
  </header>

  <main class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <h2>Happening near you</h2>
        <p id="event-count">Loading events…</p>
      </div>
      <div class="event-list" id="event-list"></div>
    </aside>

    <div class="map-wrap">
      <div id="map"></div>
    </div>
  </main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ---- EVENT DATA ----------------------------------------------------------
// To add an event: copy one block, change the values, keep the commas.
// The first one is a REAL match (Saudi Pro League, Matchweek 1).
const EVENTS = [
  {
    id: 1,
    title: "Al-Ettifaq vs Al-Riyadh",
    category: "Football",
    emoji: "\u26bd",
    venue: "Prince Mohamed bin Fahd Stadium, Dammam",
    time: "Tonight \u00b7 Aug 14",
    lat: 26.3927,
    lng: 49.9777,
    heat: 90, // 0-100 popularity — drives the glow size
    ticketUrl: "https://webook.com"
  },
  {
    id: 2,
    title: "Live Music Night",
    category: "Concert",
    emoji: "\ud83c\udfb8",
    venue: "Al Khobar Corniche",
    time: "Tonight \u00b7 9:00 PM",
    lat: 26.2870,
    lng: 50.2130,
    heat: 70,
    ticketUrl: "https://webook.com"
  },
  {
    id: 3,
    title: "Food & Culture Festival",
    category: "Festival",
    emoji: "\ud83c\udf5c",
    venue: "Al Rashid Mall Plaza",
    time: "All weekend",
    lat: 26.3050,
    lng: 50.1980,
    heat: 55,
    ticketUrl: "https://webook.com"
  },
  {
    id: 4,
    title: "Padel Championship",
    category: "Sports",
    emoji: "\ud83c\udfbe",
    venue: "Khobar Sports Hub",
    time: "Tomorrow \u00b7 5:00 PM",
    lat: 26.2680,
    lng: 50.2200,
    heat: 40,
    ticketUrl: "https://webook.com"
  }
];

// ---- MAP -----------------------------------------------------------------
const map = L.map('map', { zoomControl: true }).setView([26.2854, 50.2083], 12);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  maxZoom: 19
}).addTo(map);

const markers = {};
const allMarkers = [];

EVENTS.forEach(ev => {
  // Heat glow — bigger + brighter for hotter events
  L.circle([ev.lat, ev.lng], {
    radius: 150 + ev.heat * 6,
    color: 'transparent',
    fillColor: '#ff5a5f',
    fillOpacity: 0.06 + (ev.heat / 100) * 0.22
  }).addTo(map);

  const icon = L.divIcon({
    className: '',
    html: `<div class="pin"><span>${ev.emoji}</span></div>`,
    iconSize: [34, 34],
    iconAnchor: [17, 34],
    popupAnchor: [0, -34]
  });

  const marker = L.marker([ev.lat, ev.lng], { icon }).addTo(map);
  marker.bindPopup(`
    <div class="popup">
      <h3>${ev.title}</h3>
      <div class="meta">${ev.venue} &middot; ${ev.time}</div>
      <a href="${ev.ticketUrl}" target="_blank" rel="noopener">Get tickets</a>
    </div>
  `);

  markers[ev.id] = marker;
  allMarkers.push(marker);
});

// Zoom so every event (Khobar + Dammam) is visible at once
map.fitBounds(L.featureGroup(allMarkers).getBounds().pad(0.25));

// ---- SIDEBAR -------------------------------------------------------------
const listEl = document.getElementById('event-list');
document.getElementById('event-count').textContent = `${EVENTS.length} events happening`;

EVENTS.forEach(ev => {
  const card = document.createElement('div');
  card.className = 'event-card';
  card.innerHTML = `
    <span class="cat">${ev.category}</span>
    <h3>${ev.emoji} ${ev.title}</h3>
    <div class="meta">${ev.venue}<br>${ev.time}</div>
    <a class="buy" href="${ev.ticketUrl}" target="_blank" rel="noopener">Get tickets</a>
  `;
  card.addEventListener('click', (e) => {
    if (e.target.classList.contains('buy')) return;
    map.flyTo([ev.lat, ev.lng], 15, { duration: 0.6 });
    markers[ev.id].openPopup();
    document.querySelectorAll('.event-card').forEach(c => c.classList.remove('active'));
    card.classList.add('active');
  });
  listEl.appendChild(card);
});
</script>
</body>
</html>
