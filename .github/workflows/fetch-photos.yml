# Fetches candidate photographs for the Najd site from Pexels.
#
# Run it from the Actions tab (Run workflow). Needs one repository secret:
#   PEXELS_API_KEY — a free key from https://www.pexels.com/api/
#
# It only adds files under najd/assets/img/candidates/. No site page is
# touched, so the live site is unchanged until a candidate is promoted.
name: Fetch photo candidates

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to commit the candidates to (main makes them viewable on the site)'
        required: true
        default: 'main'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch candidates from Pexels
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node najd/scripts/fetch-photos.js

      - name: Commit the candidates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add najd/assets/img/candidates
          if git diff --cached --quiet; then
            echo "No new candidates."
            exit 0
          fi
          git commit -m "Add Pexels photo candidates for the Najd site"
          git push origin HEAD:${{ github.event.inputs.target_branch }}

      - name: Where to look
        run: |
          echo "Contact sheet committed to '${{ github.event.inputs.target_branch }}'."
          if [ "${{ github.event.inputs.target_branch }}" = "main" ]; then
            echo "Live in ~1 min at:"
            echo "https://yasser1164-ux.github.io/eventos/najd/assets/img/candidates/"
          else
            echo "GitHub Pages only serves 'main', so this branch has no preview URL."
            echo "Re-run against main, or check the files out locally."
          fi
