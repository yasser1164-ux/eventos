<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eventos — Suggest a place</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="styles.css?v=5ded0118" />
<style>
  body{overflow:auto;height:auto;min-height:100vh}
  .submit-wrap{max-width:560px;margin:0 auto;padding:24px 18px 60px}
  .submit-wrap h1{font-size:22px;letter-spacing:-.01em}
  .submit-wrap p.lead{color:var(--muted);font-size:14px;margin:6px 0 22px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .field input,.field select{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-family:inherit;font-size:15px}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent-2)}
  .btn{display:inline-block;padding:11px 18px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
  .btn.secondary{background:var(--panel-2);border:1px solid var(--line)}
  .geo-status{font-size:13px;color:var(--muted);margin:8px 0 0;min-height:18px}
  .geo-status.ok{color:#7be3a2}
  .geo-status.err{color:#ff8a8d}
  #preview-map{height:260px;border-radius:var(--radius);border:1px solid var(--line);margin:14px 0;display:none}
  .coords{font-size:13px;color:var(--muted);margin-bottom:14px}
  #sql-out{width:100%;min-height:120px;margin-top:14px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0b0e18;color:#bfe8cd;font-family:ui-monospace,monospace;font-size:12px;display:none}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">Eventos</span>
    </div>
    <div class="tagline">Suggest a place</div>
  </header>

  <main class="submit-wrap">
    <h1>Suggest a place</h1>
    <p class="lead">No coordinates needed — type the name or address and we'll find it on the map. Drag the pin to fine-tune.</p>

    <div class="field">
      <label for="f-title">Place name</label>
      <input id="f-title" placeholder="e.g. Scitech" />
    </div>
    <div class="field">
      <label for="f-venue">Address or area</label>
      <input id="f-venue" placeholder="e.g. Corniche, Al Khobar" />
    </div>
    <div class="field">
      <label for="f-category">Category</label>
      <input id="f-category" placeholder="e.g. Science, Beach, Family" />
    </div>
    <div class="field">
      <label for="f-emoji">Emoji</label>
      <input id="f-emoji" placeholder="e.g. 🔭" />
    </div>
    <div class="field">
      <label for="f-url">Info URL</label>
      <input id="f-url" placeholder="https://…" />
    </div>

    <button class="btn" id="geocode-btn">Find on map</button>
    <p class="geo-status" id="geo-status"></p>

    <div id="preview-map"></div>
    <p class="coords" id="coords"></p>

    <button class="btn secondary" id="sql-btn" style="display:none">Generate SQL for Supabase</button>
    <textarea id="sql-out" readonly></textarea>
  </main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="submit.js?v=5ded0118"></script>
</body>
</html>
