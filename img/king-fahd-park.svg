<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="King Fahd Park explore card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04160e"/>
      <stop offset=".5" stop-color="#0b3520"/>
      <stop offset="1" stop-color="#031009"/>
    </linearGradient>
    <radialGradient id="leafGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#5ce08a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#5ce08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fe89a"/>
      <stop offset="1" stop-color="#1e7a48"/>
    </linearGradient>
    <radialGradient id="lampGlow2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>

  <!-- name -->
  <text x="300" y="118" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="56" letter-spacing="8" fill="#effff4">KING FAHD PARK</text>
  <text x="300" y="160" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="17" letter-spacing="4" fill="#8fd0a8">THE KINGDOM'S LARGEST PARK</text>

  <!-- hero: trees + fountain + lamp -->
  <ellipse cx="300" cy="460" rx="260" ry="180" fill="url(#leafGlow)"/>
  <!-- big tree left -->
  <g>
    <rect x="164" y="470" width="16" height="110" rx="7" fill="#3a2618"/>
    <circle cx="172" cy="420" r="66" fill="url(#leaf)"/>
    <circle cx="128" cy="452" r="42" fill="url(#leaf)"/>
    <circle cx="218" cy="452" r="44" fill="url(#leaf)"/>
  </g>
  <!-- big tree right -->
  <g>
    <rect x="424" y="450" width="16" height="130" rx="7" fill="#3a2618"/>
    <circle cx="432" cy="396" r="60" fill="url(#leaf)"/>
    <circle cx="388" cy="432" r="40" fill="url(#leaf)"/>
    <circle cx="478" cy="430" r="42" fill="url(#leaf)"/>
  </g>
  <!-- fountain -->
  <g>
    <ellipse cx="300" cy="576" rx="88" ry="18" fill="#0d4a30" stroke="#5ce08a" stroke-width="3"/>
    <rect x="288" y="500" width="24" height="66" rx="8" fill="#14563a" stroke="#5ce08a" stroke-width="3"/>
    <g stroke="#9ff0c8" stroke-width="4" fill="none" stroke-linecap="round" opacity=".9">
      <path d="M300 498c0-22-2-34-8-44"/>
      <path d="M300 498c0-22 2-34 8-44"/>
      <path d="M300 496c-14-14-20-26-20-40"/>
      <path d="M300 496c14-14 20-26 20-40"/>
    </g>
    <circle cx="300" cy="448" r="6" fill="#c9f7de"/>
  </g>
  <!-- lamp post -->
  <g>
    <ellipse cx="530" cy="360" rx="60" ry="56" fill="url(#lampGlow2)" opacity=".5"/>
    <rect x="526" y="360" width="8" height="220" rx="4" fill="#233a2c"/>
    <circle cx="530" cy="352" r="14" fill="#ffe9b0"/>
  </g>
  <!-- path -->
  <path d="M80 660c120-30 320-30 440 0" stroke="#5ce08a" stroke-width="4" fill="none" stroke-dasharray="4 16" stroke-linecap="round" opacity=".6"/>
  <!-- fireflies -->
  <g fill="#ffe9b0" opacity=".8">
    <circle cx="240" cy="330" r="3"/>
    <circle cx="356" cy="300" r="2.5"/>
    <circle cx="90" cy="380" r="2.5"/>
  </g>

  <!-- thin divider -->
  <rect x="150" y="694" width="300" height="1.5" fill="#8fd0a8" opacity=".5"/>

  <!-- calm tagline, no date -->
  <text x="300" y="734" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="500" font-size="24" fill="#effff4">A green escape in the city</text>
  <g fill="none" stroke="#8fd0a8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M243 754c-7 0-12 5-12 12 0 9 12 21 12 21s12-12 12-21c0-7-5-12-12-12z"/>
    <circle cx="243" cy="766" r="3.5"/>
  </g>
  <text x="266" y="774" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="18" letter-spacing="3" fill="#8fd0a8">DAMMAM</text>

  <rect width="600" height="800" filter="url(#grain)" opacity=".06"/>
</svg>
