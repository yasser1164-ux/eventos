<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Scitech explore card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#041318"/>
      <stop offset=".5" stop-color="#0a2a33"/>
      <stop offset="1" stop-color="#03100f"/>
    </linearGradient>
    <radialGradient id="tealGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#35e0c8" stop-opacity=".38"/>
      <stop offset="1" stop-color="#35e0c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#eafffb"/>
      <stop offset=".6" stop-color="#35e0c8"/>
      <stop offset="1" stop-color="#0d6b5c"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>

  <ellipse cx="300" cy="140" rx="280" ry="160" fill="url(#tealGlow)" opacity=".5"/>
  <ellipse cx="300" cy="430" rx="270" ry="210" fill="url(#tealGlow)"/>

  <!-- name -->
  <text x="300" y="132" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="76" letter-spacing="16" fill="#effffc">SCITECH</text>
  <text x="300" y="176" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="17" letter-spacing="4" fill="#8fd0c4">SCIENCE &amp; TECHNOLOGY CENTER</text>

  <!-- hero: atom over planetarium dome -->
  <g fill="none" stroke="#35e0c8" stroke-width="4" opacity=".85">
    <ellipse cx="300" cy="400" rx="160" ry="62"/>
    <ellipse cx="300" cy="400" rx="160" ry="62" transform="rotate(60 300 400)"/>
    <ellipse cx="300" cy="400" rx="160" ry="62" transform="rotate(-60 300 400)"/>
  </g>
  <circle cx="300" cy="400" r="30" fill="url(#core)"/>
  <g fill="#eafffb">
    <circle cx="140" cy="400" r="8"/>
    <circle cx="382" cy="530" r="8"/>
    <circle cx="378" cy="266" r="8"/>
  </g>
  <!-- dome -->
  <path d="M170 640a130 130 0 0 1 260 0z" fill="#0d3a42" stroke="#35e0c8" stroke-width="4"/>
  <g stroke="#35e0c8" stroke-width="2.5" fill="none" opacity=".55">
    <path d="M210 640a120 100 0 0 1 60-104"/>
    <path d="M300 640v-130"/>
    <path d="M390 640a120 100 0 0 0-60-104"/>
  </g>

  <!-- thin divider -->
  <rect x="150" y="694" width="300" height="1.5" fill="#8fd0c4" opacity=".5"/>

  <!-- calm tagline, no date -->
  <text x="300" y="734" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="500" font-size="24" fill="#e2fbf5">Where science comes to play</text>
  <g fill="none" stroke="#8fd0c4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M216 754c-7 0-12 5-12 12 0 9 12 21 12 21s12-12 12-21c0-7-5-12-12-12z"/>
    <circle cx="216" cy="766" r="3.5"/>
  </g>
  <text x="239" y="774" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="18" letter-spacing="3" fill="#8fd0c4">KHOBAR CORNICHE</text>

  <rect width="600" height="800" filter="url(#grain)" opacity=".06"/>
</svg>
