<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="The Big Bounce Arabia poster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0a2a"/>
      <stop offset=".5" stop-color="#2e1250"/>
      <stop offset="1" stop-color="#140820"/>
    </linearGradient>
    <radialGradient id="pinkGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff5ea8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ff5ea8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="castle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7ab8"/>
      <stop offset="1" stop-color="#c93a86"/>
    </linearGradient>
    <linearGradient id="castleTower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fd6ff"/>
      <stop offset="1" stop-color="#2a8ac9"/>
    </linearGradient>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>

  <ellipse cx="300" cy="120" rx="280" ry="160" fill="url(#pinkGlow)" opacity=".6"/>

  <!-- two-tone grunge title -->
  <g filter="url(#rough)">
    <text x="300" y="122" text-anchor="middle" font-family="'Arial Narrow','Oswald',Impact,'Helvetica Neue',sans-serif" font-weight="900" font-size="76" fill="#ffe9f4" textLength="520" lengthAdjust="spacingAndGlyphs">THE BIG BOUNCE</text>
    <text x="300" y="190" text-anchor="middle" font-family="'Arial Narrow','Oswald',Impact,'Helvetica Neue',sans-serif" font-weight="900" font-size="60" fill="#ff5ea8" textLength="280" lengthAdjust="spacingAndGlyphs">ARABIA</text>
  </g>

  <!-- date line between thin rules + venue line -->
  <rect x="140" y="212" width="320" height="1.5" fill="#ff5ea8" opacity=".55"/>
  <text x="300" y="240" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="22" letter-spacing="8" fill="#ff5ea8">AUG 20&#8211;29</text>
  <rect x="140" y="252" width="320" height="1.5" fill="#ff5ea8" opacity=".55"/>
  <text x="300" y="282" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="16" letter-spacing="5" fill="#e3c9ec">AL KHOBAR</text>

  <!-- hero: bouncy castle + flying balls -->
  <ellipse cx="300" cy="500" rx="250" ry="160" fill="url(#pinkGlow)" opacity=".6"/>
  <!-- towers -->
  <g>
    <rect x="150" y="380" width="64" height="200" rx="32" fill="url(#castleTower)"/>
    <rect x="386" y="380" width="64" height="200" rx="32" fill="url(#castleTower)"/>
    <circle cx="182" cy="378" r="20" fill="#ffd166"/>
    <circle cx="418" cy="378" r="20" fill="#ffd166"/>
    <!-- body -->
    <path d="M214 452h172v128H214z" fill="url(#castle)"/>
    <path d="M214 452q43-36 86 0t86 0v34q-43-30-86 0t-86 0z" fill="#ffb1d4"/>
    <!-- door -->
    <path d="M266 580v-58c0-20 14-34 34-34s34 14 34 34v58z" fill="#31114e"/>
    <!-- base cushion -->
    <rect x="128" y="580" width="344" height="34" rx="17" fill="#8a2f9e"/>
  </g>
  <!-- bouncing balls with motion arcs -->
  <g>
    <circle cx="120" cy="330" r="16" fill="#ffd166"/>
    <path d="M96 366a44 44 0 0 1 10-44" stroke="#ffd166" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
    <circle cx="488" cy="316" r="13" fill="#6fd6ff"/>
    <path d="M508 352a40 40 0 0 0-6-44" stroke="#6fd6ff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
    <circle cx="300" cy="330" r="10" fill="#4be3a0"/>
  </g>
  <g fill="#ffe9f4">
    <polygon points="90,470 95,481 106,484 95,487 90,498 85,487 74,484 85,481"/>
    <polygon points="512,452 516,461 525,464 516,467 512,476 508,467 499,464 508,461"/>
  </g>

  <!-- divider -->
  <rect x="40" y="650" width="520" height="2" fill="#ff5ea8" opacity=".5"/>

  <!-- three-segment info strip -->
  <g fill="none" stroke="#ff5ea8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="42" y="676" width="22" height="20" rx="3"/>
    <line x1="42" y1="683" x2="64" y2="683"/>
    <line x1="48" y1="672" x2="48" y2="679"/>
    <line x1="58" y1="672" x2="58" y2="679"/>
  </g>
  <text x="74" y="684" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="14" letter-spacing="1" fill="#ff5ea8">AUG</text>
  <text x="74" y="704" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#ffffff">20&#8211;29</text>

  <rect x="203" y="668" width="1.5" height="42" fill="#ff5ea8" opacity=".35"/>

  <g fill="none" stroke="#ff5ea8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M232 672c-8 0-14 6-14 14 0 10 14 24 14 24s14-14 14-24c0-8-6-14-14-14z"/>
    <circle cx="232" cy="686" r="4"/>
  </g>
  <text x="258" y="684" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="14" letter-spacing="1" fill="#ff5ea8">AL KHOBAR</text>
  <text x="258" y="704" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#ffffff">BOUNCE PARK</text>

  <rect x="408" y="668" width="1.5" height="42" fill="#ff5ea8" opacity=".35"/>

  <g stroke="#ff5ea8" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="430" cy="680" r="8"/>
    <path d="M420 700a14 14 0 0 1 20 0"/>
    <path d="M440 692a26 26 0 0 1 8 10"/>
  </g>
  <text x="458" y="684" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="14" letter-spacing="1" fill="#ff5ea8">PURE FUN</text>
  <text x="458" y="704" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#ffffff">JUMP IN</text>

  <rect width="600" height="800" filter="url(#grain)" opacity=".07"/>
</svg>
