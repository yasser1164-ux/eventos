<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Live Music Night poster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0618"/>
      <stop offset=".5" stop-color="#1c0b33"/>
      <stop offset="1" stop-color="#0a0512"/>
    </linearGradient>
    <linearGradient id="barA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4be3d0"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="barB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#37b8c9"/>
    </linearGradient>
    <radialGradient id="stageGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4be3d0" stop-opacity=".4"/>
      <stop offset="1" stop-color="#4be3d0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>

  <!-- stage light beams -->
  <polygon points="120,0 190,0 420,610 280,610" fill="#4be3d0" opacity=".10"/>
  <polygon points="410,0 480,0 320,610 180,610" fill="#a78bfa" opacity=".12"/>
  <ellipse cx="140" cy="70" rx="200" ry="150" fill="url(#tealGlow)"/>
  <ellipse cx="470" cy="90" rx="200" ry="150" fill="url(#stageGlow)"/>

  <!-- two-tone grunge title -->
  <g filter="url(#rough)">
    <text x="300" y="122" text-anchor="middle" font-family="'Arial Narrow','Oswald',Impact,'Helvetica Neue',sans-serif" font-weight="900" font-size="80" fill="#f4f0ff" textLength="520" lengthAdjust="spacingAndGlyphs">LIVE MUSIC</text>
    <text x="300" y="188" text-anchor="middle" font-family="'Arial Narrow','Oswald',Impact,'Helvetica Neue',sans-serif" font-weight="900" font-size="60" fill="#4be3d0" textLength="240" lengthAdjust="spacingAndGlyphs">NIGHT</text>
  </g>

  <!-- date line between thin rules + venue line -->
  <rect x="140" y="210" width="320" height="1.5" fill="#4be3d0" opacity=".6"/>
  <text x="300" y="238" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="22" letter-spacing="8" fill="#4be3d0">TONIGHT &#183; 9:00 PM</text>
  <rect x="140" y="250" width="320" height="1.5" fill="#4be3d0" opacity=".6"/>
  <text x="300" y="280" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="16" letter-spacing="5" fill="#cfc7ec">AL KHOBAR CORNICHE</text>

  <!-- hero: glowing equalizer -->
  <ellipse cx="300" cy="460" rx="260" ry="170" fill="url(#stageGlow)"/>
  <g filter="url(#soft)" opacity=".8">
    <rect x="152" y="404" width="30" height="116" rx="15" fill="url(#barA)"/>
    <rect x="196" y="356" width="30" height="212" rx="15" fill="url(#barB)"/>
    <rect x="240" y="316" width="30" height="292" rx="15" fill="url(#barA)"/>
    <rect x="284" y="368" width="30" height="188" rx="15" fill="url(#barB)"/>
    <rect x="328" y="300" width="30" height="324" rx="15" fill="url(#barA)"/>
    <rect x="372" y="380" width="30" height="164" rx="15" fill="url(#barB)"/>
    <rect x="416" y="428" width="30" height="68" rx="15" fill="url(#barA)"/>
  </g>
  <g>
    <rect x="152" y="404" width="30" height="116" rx="15" fill="url(#barA)"/>
    <rect x="196" y="356" width="30" height="212" rx="15" fill="url(#barB)"/>
    <rect x="240" y="316" width="30" height="292" rx="15" fill="url(#barA)"/>
    <rect x="284" y="368" width="30" height="188" rx="15" fill="url(#barB)"/>
    <rect x="328" y="300" width="30" height="324" rx="15" fill="url(#barA)"/>
    <rect x="372" y="380" width="30" height="164" rx="15" fill="url(#barB)"/>
    <rect x="416" y="428" width="30" height="68" rx="15" fill="url(#barA)"/>
  </g>

  <!-- divider -->
  <rect x="40" y="650" width="520" height="2" fill="#a78bfa" opacity=".55"/>

  <!-- three-segment info strip -->
  <g fill="none" stroke="#4be3d0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="42" y="676" width="22" height="20" rx="3"/>
    <line x1="42" y1="683" x2="64" y2="683"/>
    <line x1="48" y1="672" x2="48" y2="679"/>
    <line x1="58" y1="672" x2="58" y2="679"/>
  </g>
  <text x="74" y="684" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="14" letter-spacing="1" fill="#4be3d0">TONIGHT</text>
  <text x="74" y="704" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#ffffff">9:00 PM</text>

  <rect x="203" y="668" width="1.5" height="42" fill="#a78bfa" opacity=".4"/>

  <g fill="none" stroke="#4be3d0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M232 672c-8 0-14 6-14 14 0 10 14 24 14 24s14-14 14-24c0-8-6-14-14-14z"/>
    <circle cx="232" cy="686" r="4"/>
  </g>
  <text x="258" y="684" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="14" letter-spacing="1" fill="#4be3d0">AL KHOBAR</text>
  <text x="258" y="704" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#ffffff">CORNICHE</text>

  <rect x="408" y="668" width="1.5" height="42" fill="#a78bfa" opacity=".4"/>

  <g stroke="#4be3d0" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="430" cy="696" r="6"/>
    <line x1="436" y1="696" x2="436" y2="674"/>
    <path d="M436 674c6 2 10 4 12 8"/>
  </g>
  <text x="458" y="684" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="14" letter-spacing="1" fill="#4be3d0">LIVE ON</text>
  <text x="458" y="704" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#ffffff">THE CORNICHE</text>

  <rect width="600" height="800" filter="url(#grain)" opacity=".07"/>
</svg>
