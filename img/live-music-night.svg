<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Live Music Night poster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0618"/>
      <stop offset=".5" stop-color="#1c0b33"/>
      <stop offset="1" stop-color="#0a0512"/>
    </linearGradient>
    <linearGradient id="barA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4be3d0"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="barB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#37b8c9"/>
    </linearGradient>
    <radialGradient id="stageGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4be3d0" stop-opacity=".4"/>
      <stop offset="1" stop-color="#4be3d0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>

  <!-- stage light beams -->
  <polygon points="120,0 190,0 420,600 280,600" fill="#4be3d0" opacity=".10"/>
  <polygon points="410,0 480,0 320,600 180,600" fill="#a78bfa" opacity=".12"/>
  <ellipse cx="140" cy="70" rx="200" ry="150" fill="url(#tealGlow)"/>
  <ellipse cx="470" cy="90" rx="200" ry="150" fill="url(#stageGlow)"/>

  <!-- title -->
  <text x="300" y="130" text-anchor="middle" font-family="'Arial Narrow','Oswald',Impact,'Helvetica Neue',sans-serif" font-weight="900" font-size="88" fill="#f4f0ff" textLength="520" lengthAdjust="spacingAndGlyphs">LIVE MUSIC</text>
  <text x="300" y="204" text-anchor="middle" font-family="'Arial Narrow','Oswald',Impact,'Helvetica Neue',sans-serif" font-weight="900" font-size="70" fill="#4be3d0" textLength="260" lengthAdjust="spacingAndGlyphs">NIGHT</text>

  <!-- hero: glowing equalizer -->
  <ellipse cx="300" cy="450" rx="260" ry="170" fill="url(#stageGlow)"/>
  <g filter="url(#soft)" opacity=".8">
    <rect x="152" y="392" width="30" height="116" rx="15" fill="url(#barA)"/>
    <rect x="196" y="344" width="30" height="212" rx="15" fill="url(#barB)"/>
    <rect x="240" y="304" width="30" height="292" rx="15" fill="url(#barA)"/>
    <rect x="284" y="356" width="30" height="188" rx="15" fill="url(#barB)"/>
    <rect x="328" y="288" width="30" height="324" rx="15" fill="url(#barA)"/>
    <rect x="372" y="368" width="30" height="164" rx="15" fill="url(#barB)"/>
    <rect x="416" y="416" width="30" height="68" rx="15" fill="url(#barA)"/>
  </g>
  <g>
    <rect x="152" y="392" width="30" height="116" rx="15" fill="url(#barA)"/>
    <rect x="196" y="344" width="30" height="212" rx="15" fill="url(#barB)"/>
    <rect x="240" y="304" width="30" height="292" rx="15" fill="url(#barA)"/>
    <rect x="284" y="356" width="30" height="188" rx="15" fill="url(#barB)"/>
    <rect x="328" y="288" width="30" height="324" rx="15" fill="url(#barA)"/>
    <rect x="372" y="368" width="30" height="164" rx="15" fill="url(#barB)"/>
    <rect x="416" y="416" width="30" height="68" rx="15" fill="url(#barA)"/>
  </g>
  <g stroke="#4be3d0" stroke-opacity=".45" fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M120 258a210 210 0 0 1 360 0"/>
    <path d="M160 232a170 170 0 0 1 280 0" stroke="#a78bfa"/>
  </g>

  <!-- divider -->
  <rect x="40" y="640" width="520" height="2" fill="#a78bfa" opacity=".55"/>

  <!-- info strip -->
  <g fill="none" stroke="#4be3d0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="44" y="672" width="24" height="22" rx="4"/>
    <line x1="44" y1="680" x2="68" y2="680"/>
    <line x1="51" y1="668" x2="51" y2="675"/>
    <line x1="61" y1="668" x2="61" y2="675"/>
  </g>
  <text x="84" y="690" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="24" fill="#f4f0ff">TONIGHT &#183; 9:00 PM</text>

  <g fill="none" stroke="#4be3d0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M56 710c-9 0-16 7-16 16 0 12 16 28 16 28s16-16 16-28c0-9-7-16-16-16z"/>
    <circle cx="56" cy="726" r="5"/>
  </g>
  <text x="84" y="738" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="20" fill="#d9d2f0">AL KHOBAR CORNICHE</text>

  <text x="300" y="782" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="20" letter-spacing="7" fill="#a78bfa">LIVE ON THE CORNICHE</text>

  <rect width="600" height="800" filter="url(#grain)" opacity=".07"/>
</svg>
