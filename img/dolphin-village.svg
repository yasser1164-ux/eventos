<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Dolphin Village explore card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03182b"/>
      <stop offset=".5" stop-color="#07395c"/>
      <stop offset="1" stop-color="#021220"/>
    </linearGradient>
    <radialGradient id="aquaGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4fd8ff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#4fd8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dolphin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fe6ff"/>
      <stop offset="1" stop-color="#3a9fd4"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>

  <!-- name -->
  <text x="300" y="118" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="54" letter-spacing="7" fill="#eefaff">DOLPHIN VILLAGE</text>
  <text x="300" y="160" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="17" letter-spacing="4" fill="#8fc8e0">AZIZIYAH &#183; AL KHOBAR</text>

  <!-- hero: leaping dolphin over waves -->
  <ellipse cx="300" cy="440" rx="250" ry="170" fill="url(#aquaGlow)"/>
  <!-- leap arc -->
  <path d="M140 520a170 170 0 0 1 320 0" stroke="#4fd8ff" stroke-width="3" fill="none" stroke-dasharray="2 14" stroke-linecap="round" opacity=".7"/>
  <!-- dolphin body -->
  <g transform="rotate(-14 300 380)">
    <path d="M180 420c10-52 62-96 130-96 52 0 96 22 116 56 6 10 0 16-10 12-14-6-28-8-40-6 26 20 40 48 38 74-1 12-10 14-17 5-12-16-28-30-46-36-14 26-46 44-84 44-40 0-74-20-87-42-4-7-2-11 0-11z" fill="url(#dolphin)"/>
    <!-- dorsal fin -->
    <path d="M292 322c-4-22 6-40 24-50 6 16 2 34-8 48z" fill="#3a9fd4"/>
    <!-- tail -->
    <path d="M180 420c-16-8-34-8-46 2 10 8 18 20 20 32 12-6 22-18 26-34z" fill="#3a9fd4"/>
    <!-- eye + smile -->
    <circle cx="384" cy="374" r="6" fill="#062338"/>
    <path d="M398 392c8 4 18 4 26 0" stroke="#062338" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- splash -->
  <g stroke="#9fe6ff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".85">
    <path d="M210 520c6-14 4-28-4-38"/>
    <path d="M234 528c8-12 8-26 2-38"/>
    <path d="M386 528c-8-12-8-26-2-38"/>
  </g>
  <!-- ball -->
  <circle cx="452" cy="360" r="22" fill="#ffd166"/>
  <path d="M430 360h44M452 338v44" stroke="#e2984a" stroke-width="3"/>
  <!-- waves -->
  <g stroke="#4fd8ff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7">
    <path d="M90 580c30-14 60-14 90 0s60 14 90 0 60-14 90 0 60 14 90 0"/>
    <path d="M130 618c26-12 52-12 78 0s52 12 78 0 52-12 78 0 52 12 78 0" opacity=".7"/>
    <path d="M170 654c22-10 44-10 66 0s44 10 66 0 44-10 66 0" opacity=".5"/>
  </g>

  <!-- thin divider -->
  <rect x="150" y="694" width="300" height="1.5" fill="#8fc8e0" opacity=".5"/>

  <!-- calm tagline, no date -->
  <text x="300" y="734" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="500" font-size="24" fill="#eefaff">Splash into family fun</text>
  <g fill="none" stroke="#8fc8e0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M234 754c-7 0-12 5-12 12 0 9 12 21 12 21s12-12 12-21c0-7-5-12-12-12z"/>
    <circle cx="234" cy="766" r="3.5"/>
  </g>
  <text x="257" y="774" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="18" letter-spacing="3" fill="#8fc8e0">AL KHOBAR</text>

  <rect width="600" height="800" filter="url(#grain)" opacity=".06"/>
</svg>
