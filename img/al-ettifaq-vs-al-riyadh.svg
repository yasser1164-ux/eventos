<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Al-Ettifaq vs Al-Riyadh match poster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03180b"/>
      <stop offset=".45" stop-color="#0a3b1c"/>
      <stop offset="1" stop-color="#041f0f"/>
    </linearGradient>
    <radialGradient id="floodL" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pitchGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2ea25a" stop-opacity=".5"/>
      <stop offset="1" stop-color="#2ea25a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset=".55" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#8a6a14"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>

  <!-- floodlight flares -->
  <ellipse cx="60" cy="40" rx="260" ry="200" fill="url(#floodL)"/>
  <ellipse cx="540" cy="40" rx="260" ry="200" fill="url(#floodL)"/>
  <polygon points="40,0 120,0 360,560 240,560" fill="#fff8dd" opacity=".05"/>
  <polygon points="480,0 560,0 360,560 240,560" fill="#fff8dd" opacity=".05"/>

  <!-- title -->
  <text x="300" y="128" text-anchor="middle" font-family="'Arial Narrow','Oswald',Impact,'Helvetica Neue',sans-serif" font-weight="900" font-size="86" letter-spacing="1" fill="#f5c542" textLength="520" lengthAdjust="spacingAndGlyphs">AL-ETTIFAQ</text>
  <text x="300" y="196" text-anchor="middle" font-family="'Arial Narrow','Oswald',Impact,'Helvetica Neue',sans-serif" font-weight="900" font-size="56" fill="#eef7ee" textLength="380" lengthAdjust="spacingAndGlyphs">VS AL-RIYADH</text>

  <!-- hero: pitch + ball -->
  <ellipse cx="300" cy="430" rx="250" ry="180" fill="url(#pitchGlow)"/>
  <g stroke="#bfe8cd" stroke-opacity=".5" fill="none" stroke-width="3">
    <ellipse cx="300" cy="470" rx="215" ry="72"/>
    <line x1="85" y1="470" x2="515" y2="470"/>
    <ellipse cx="300" cy="470" rx="70" ry="24"/>
  </g>
  <circle cx="300" cy="408" r="78" fill="url(#ball)"/>
  <g fill="#123317">
    <polygon points="300,368 336,394 322,436 278,436 264,394"/>
    <polygon points="300,330 316,344 300,352 284,344" opacity=".85"/>
    <polygon points="374,398 384,418 370,432 356,414" opacity=".85"/>
    <polygon points="226,398 216,418 230,432 244,414" opacity=".85"/>
    <polygon points="332,472 350,462 358,478 338,486" opacity=".85"/>
    <polygon points="268,472 250,462 242,478 262,486" opacity=".85"/>
  </g>
  <ellipse cx="300" cy="512" rx="96" ry="14" fill="#02120a" opacity=".55"/>

  <!-- divider -->
  <rect x="40" y="618" width="520" height="2" fill="#f5c542" opacity=".55"/>

  <!-- info strip -->
  <g fill="none" stroke="#f5c542" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="44" y="654" width="24" height="22" rx="4"/>
    <line x1="44" y1="662" x2="68" y2="662"/>
    <line x1="51" y1="650" x2="51" y2="657"/>
    <line x1="61" y1="650" x2="61" y2="657"/>
  </g>
  <text x="84" y="672" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="24" fill="#fdf6e3">TONIGHT &#183; AUG 14</text>

  <g fill="none" stroke="#f5c542" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M56 694c-9 0-16 7-16 16 0 12 16 28 16 28s16-16 16-28c0-9-7-16-16-16z"/>
    <circle cx="56" cy="710" r="5"/>
  </g>
  <text x="84" y="722" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="19" fill="#d7e6d9">PRINCE MOHAMED BIN FAHD STADIUM, DAMMAM</text>

  <text x="300" y="772" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="20" letter-spacing="6" fill="#f5c542">SAUDI PRO LEAGUE &#183; FEEL THE ROAR</text>

  <rect width="600" height="800" filter="url(#grain)" opacity=".07"/>
</svg>
