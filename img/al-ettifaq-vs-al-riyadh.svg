<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Al-Ettifaq vs Al-Riyadh match poster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03180b"/>
      <stop offset=".45" stop-color="#0a3b1c"/>
      <stop offset="1" stop-color="#041f0f"/>
    </linearGradient>
    <radialGradient id="floodL" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pitchGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2ea25a" stop-opacity=".5"/>
      <stop offset="1" stop-color="#2ea25a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset=".55" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#8a6a14"/>
    </radialGradient>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>

  <!-- floodlight flares -->
  <ellipse cx="60" cy="40" rx="260" ry="200" fill="url(#floodL)"/>
  <ellipse cx="540" cy="40" rx="260" ry="200" fill="url(#floodL)"/>
  <polygon points="40,0 120,0 360,560 240,560" fill="#fff8dd" opacity=".05"/>
  <polygon points="480,0 560,0 360,560 240,560" fill="#fff8dd" opacity=".05"/>

  <!-- two-tone grunge title -->
  <g filter="url(#rough)">
    <text x="300" y="122" text-anchor="middle" font-family="'Arial Narrow','Oswald',Impact,'Helvetica Neue',sans-serif" font-weight="900" font-size="82" fill="#f5c542" textLength="520" lengthAdjust="spacingAndGlyphs">AL-ETTIFAQ</text>
    <text x="300" y="184" text-anchor="middle" font-family="'Arial Narrow','Oswald',Impact,'Helvetica Neue',sans-serif" font-weight="900" font-size="52" fill="#eef7ee" textLength="360" lengthAdjust="spacingAndGlyphs">VS AL-RIYADH</text>
  </g>

  <!-- date line between thin rules + venue line -->
  <rect x="140" y="206" width="320" height="1.5" fill="#f5c542" opacity=".6"/>
  <text x="300" y="234" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="22" letter-spacing="8" fill="#f5c542">TONIGHT &#183; AUG 14</text>
  <rect x="140" y="246" width="320" height="1.5" fill="#f5c542" opacity=".6"/>
  <text x="300" y="276" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="16" letter-spacing="5" fill="#cfe3d4">SAUDI PRO LEAGUE &#183; MATCHWEEK 1</text>

  <!-- hero: pitch + ball -->
  <ellipse cx="300" cy="455" rx="250" ry="180" fill="url(#pitchGlow)"/>
  <g stroke="#bfe8cd" stroke-opacity=".5" fill="none" stroke-width="3">
    <ellipse cx="300" cy="492" rx="215" ry="72"/>
    <line x1="85" y1="492" x2="515" y2="492"/>
    <ellipse cx="300" cy="492" rx="70" ry="24"/>
  </g>
  <circle cx="300" cy="430" r="78" fill="url(#ball)"/>
  <g fill="#123317">
    <polygon points="300,390 336,416 322,458 278,458 264,416"/>
    <polygon points="300,352 316,366 300,374 284,366" opacity=".85"/>
    <polygon points="374,420 384,440 370,454 356,436" opacity=".85"/>
    <polygon points="226,420 216,440 230,454 244,436" opacity=".85"/>
    <polygon points="332,494 350,484 358,500 338,508" opacity=".85"/>
    <polygon points="268,494 250,484 242,500 262,508" opacity=".85"/>
  </g>
  <ellipse cx="300" cy="534" rx="96" ry="14" fill="#02120a" opacity=".55"/>

  <!-- divider -->
  <rect x="40" y="650" width="520" height="2" fill="#f5c542" opacity=".55"/>

  <!-- three-segment info strip -->
  <g fill="none" stroke="#f5c542" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="42" y="676" width="22" height="20" rx="3"/>
    <line x1="42" y1="683" x2="64" y2="683"/>
    <line x1="48" y1="672" x2="48" y2="679"/>
    <line x1="58" y1="672" x2="58" y2="679"/>
  </g>
  <text x="74" y="684" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="14" letter-spacing="1" fill="#f5c542">TONIGHT</text>
  <text x="74" y="704" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#ffffff">AUG 14</text>

  <rect x="203" y="668" width="1.5" height="42" fill="#f5c542" opacity=".35"/>

  <g fill="none" stroke="#f5c542" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M232 672c-8 0-14 6-14 14 0 10 14 24 14 24s14-14 14-24c0-8-6-14-14-14z"/>
    <circle cx="232" cy="686" r="4"/>
  </g>
  <text x="258" y="684" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="14" letter-spacing="1" fill="#f5c542">BIN FAHD STADIUM</text>
  <text x="258" y="704" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#ffffff">DAMMAM</text>

  <rect x="408" y="668" width="1.5" height="42" fill="#f5c542" opacity=".35"/>

  <g stroke="#f5c542" stroke-width="2.5" fill="none">
    <circle cx="434" cy="688" r="13"/>
    <polygon points="434,681 441,686 438,694 430,694 427,686"/>
  </g>
  <text x="458" y="684" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="13" letter-spacing=".5" fill="#f5c542">LIVE THE PASSION</text>
  <text x="458" y="704" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#ffffff">FEEL THE ROAR</text>

  <rect width="600" height="800" filter="url(#grain)" opacity=".07"/>
</svg>
