<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Padel Championship poster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02121e"/>
      <stop offset=".5" stop-color="#073042"/>
      <stop offset="1" stop-color="#02101a"/>
    </linearGradient>
    <linearGradient id="racket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0fb4d4"/>
      <stop offset="1" stop-color="#0a5f86"/>
    </linearGradient>
    <radialGradient id="neonGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b6ff3d" stop-opacity=".5"/>
      <stop offset="1" stop-color="#b6ff3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ballGrad" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#e8ffb0"/>
      <stop offset=".6" stop-color="#b6ff3d"/>
      <stop offset="1" stop-color="#5c8f0e"/>
    </radialGradient>
    <pattern id="holes" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="17" cy="17" r="7" fill="#043046"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>

  <!-- court glass wall grid -->
  <g stroke="#35d6ff" stroke-opacity=".14" stroke-width="2">
    <line x1="0" y1="260" x2="600" y2="230"/>
    <line x1="0" y1="360" x2="600" y2="330"/>
    <line x1="0" y1="460" x2="600" y2="430"/>
    <line x1="0" y1="560" x2="600" y2="530"/>
    <line x1="120" y1="200" x2="120" y2="620"/>
    <line x1="300" y1="200" x2="300" y2="620"/>
    <line x1="480" y1="200" x2="480" y2="620"/>
  </g>

  <!-- title -->
  <text x="300" y="150" text-anchor="middle" font-family="'Arial Narrow','Oswald',Impact,'Helvetica Neue',sans-serif" font-weight="900" font-size="128" fill="#eafcff" textLength="440" lengthAdjust="spacingAndGlyphs">PADEL</text>
  <text x="300" y="216" text-anchor="middle" font-family="'Arial Narrow','Oswald',Impact,'Helvetica Neue',sans-serif" font-weight="900" font-size="54" fill="#b6ff3d" textLength="520" lengthAdjust="spacingAndGlyphs">CHAMPIONSHIP</text>

  <!-- hero: racket + neon ball -->
  <ellipse cx="300" cy="440" rx="250" ry="170" fill="url(#neonGlow)" opacity=".55"/>
  <g transform="rotate(-18 300 430)">
    <rect x="272" y="500" width="56" height="110" rx="24" fill="#0a5f86"/>
    <rect x="272" y="500" width="56" height="110" rx="24" fill="none" stroke="#35d6ff" stroke-width="4"/>
    <path d="M300 260c86 0 148 52 148 128 0 82-62 132-148 132s-148-50-148-132c0-76 62-128 148-128z" fill="url(#racket)"/>
    <path d="M300 288c68 0 118 40 118 100 0 66-50 104-118 104s-118-38-118-104c0-60 50-100 118-100z" fill="url(#holes)"/>
    <path d="M300 260c86 0 148 52 148 128 0 82-62 132-148 132s-148-50-148-132c0-76 62-128 148-128z" fill="none" stroke="#35d6ff" stroke-width="6"/>
  </g>
  <g stroke="#b6ff3d" stroke-width="5" fill="none" stroke-linecap="round" opacity=".8">
    <path d="M424 306a96 96 0 0 1 44 66"/>
    <path d="M452 282a132 132 0 0 1 58 88" opacity=".5"/>
  </g>
  <circle cx="452" cy="404" r="40" fill="url(#ballGrad)"/>
  <path d="M420 380c18 14 20 36 8 56" stroke="#3a5c08" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- divider -->
  <rect x="40" y="640" width="520" height="2" fill="#b6ff3d" opacity=".5"/>

  <!-- info strip -->
  <g fill="none" stroke="#b6ff3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="44" y="672" width="24" height="22" rx="4"/>
    <line x1="44" y1="680" x2="68" y2="680"/>
    <line x1="51" y1="668" x2="51" y2="675"/>
    <line x1="61" y1="668" x2="61" y2="675"/>
  </g>
  <text x="84" y="690" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="24" fill="#eafcff">TOMORROW &#183; 5:00 PM</text>

  <g fill="none" stroke="#b6ff3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M56 710c-9 0-16 7-16 16 0 12 16 28 16 28s16-16 16-28c0-9-7-16-16-16z"/>
    <circle cx="56" cy="726" r="5"/>
  </g>
  <text x="84" y="738" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="20" fill="#bfe3ef">KHOBAR SPORTS HUB</text>

  <text x="300" y="782" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="20" letter-spacing="10" fill="#b6ff3d">GAME ON</text>

  <rect width="600" height="800" filter="url(#grain)" opacity=".07"/>
</svg>
