<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Heritage Nights poster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#190c04"/>
      <stop offset=".5" stop-color="#301708"/>
      <stop offset="1" stop-color="#140903"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffb35c" stop-opacity=".65"/>
      <stop offset="1" stop-color="#ffb35c" stop-opacity="0"/>
    </radialGradient>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>

  <!-- crescent moon + stars -->
  <path d="M508 84a44 44 0 1 0 22 74 36 36 0 1 1-22-74z" fill="#ffe1b0" opacity=".9"/>
  <g fill="#ffd9a0" opacity=".8">
    <circle cx="90" cy="70" r="3"/>
    <circle cx="150" cy="120" r="2"/>
    <circle cx="420" cy="60" r="2.5"/>
    <circle cx="70" cy="160" r="2"/>
  </g>

  <!-- two-tone grunge title -->
  <g filter="url(#rough)">
    <text x="300" y="128" text-anchor="middle" font-family="'Arial Narrow','Oswald',Impact,'Helvetica Neue',sans-serif" font-weight="900" font-size="86" fill="#ffe8c8" textLength="460" lengthAdjust="spacingAndGlyphs">HERITAGE</text>
    <text x="300" y="192" text-anchor="middle" font-family="'Arial Narrow','Oswald',Impact,'Helvetica Neue',sans-serif" font-weight="900" font-size="56" fill="#ff9c4a" textLength="280" lengthAdjust="spacingAndGlyphs">NIGHTS</text>
  </g>

  <!-- date line between thin rules + venue line -->
  <rect x="140" y="214" width="320" height="1.5" fill="#ff9c4a" opacity=".55"/>
  <text x="300" y="242" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="22" letter-spacing="8" fill="#ff9c4a">DAILY &#183; 6&#8211;11 PM</text>
  <rect x="140" y="254" width="320" height="1.5" fill="#ff9c4a" opacity=".55"/>
  <text x="300" y="284" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="16" letter-spacing="5" fill="#ecd9bd">HERITAGE VILLAGE &#183; DAMMAM</text>

  <!-- hero: desert fort + lantern -->
  <ellipse cx="300" cy="500" rx="250" ry="160" fill="url(#lampGlow)" opacity=".45"/>
  <!-- fort silhouette -->
  <g fill="#2a1406" stroke="#ff9c4a" stroke-width="3">
    <path d="M120 600v-120h20v-16h18v16h26v-16h18v16h26v-16h18v16h20v120z"/>
    <path d="M420 600v-150c0-14 10-24 24-24s24 10 24 24v6h14v-12h14v12h14v-12h14v12h12v144z" transform="translate(-56 0)"/>
    <rect x="266" y="520" width="120" height="80"/>
  </g>
  <path d="M296 600v-44c0-16 12-28 30-28s30 12 30 28v44z" fill="#1a0c04" stroke="#ff9c4a" stroke-width="3" transform="translate(-26 0)"/>
  <!-- hanging lantern -->
  <line x1="300" y1="300" x2="300" y2="356" stroke="#caa64f" stroke-width="3"/>
  <ellipse cx="300" cy="404" rx="86" ry="76" fill="url(#lampGlow)"/>
  <g stroke="#ffcf8a" stroke-width="4" fill="#7a3d10">
    <path d="M276 362h48l10 22-8 44c-2 10-8 16-26 16s-24-6-26-16l-8-44z"/>
  </g>
  <g stroke="#ffcf8a" stroke-width="2.5" fill="none" opacity=".9">
    <line x1="300" y1="362" x2="300" y2="444"/>
    <path d="M278 384c14 8 30 8 44 0"/>
    <path d="M276 418c15 9 33 9 48 0"/>
  </g>
  <rect x="288" y="350" width="24" height="8" rx="3" fill="#ffcf8a"/>
  <path d="M60 600h480" stroke="#ff9c4a" stroke-width="3" opacity=".6"/>

  <!-- divider -->
  <rect x="40" y="650" width="520" height="2" fill="#ff9c4a" opacity=".5"/>

  <!-- three-segment info strip -->
  <g fill="none" stroke="#ff9c4a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="42" y="676" width="22" height="20" rx="3"/>
    <line x1="42" y1="683" x2="64" y2="683"/>
    <line x1="48" y1="672" x2="48" y2="679"/>
    <line x1="58" y1="672" x2="58" y2="679"/>
  </g>
  <text x="74" y="684" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="14" letter-spacing="1" fill="#ff9c4a">DAILY</text>
  <text x="74" y="704" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#ffffff">6&#8211;11 PM</text>

  <rect x="203" y="668" width="1.5" height="42" fill="#ff9c4a" opacity=".35"/>

  <g fill="none" stroke="#ff9c4a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M232 672c-8 0-14 6-14 14 0 10 14 24 14 24s14-14 14-24c0-8-6-14-14-14z"/>
    <circle cx="232" cy="686" r="4"/>
  </g>
  <text x="258" y="684" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="14" letter-spacing="1" fill="#ff9c4a">HERITAGE VILLAGE</text>
  <text x="258" y="704" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#ffffff">DAMMAM</text>

  <rect x="408" y="668" width="1.5" height="42" fill="#ff9c4a" opacity=".35"/>

  <g stroke="#ff9c4a" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M427 676h14l3 7-2 13c-1 3-3 5-8 5s-7-2-8-5l-2-13z"/>
    <line x1="434" y1="672" x2="434" y2="676"/>
  </g>
  <text x="458" y="684" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="14" letter-spacing="1" fill="#ff9c4a">OLD STORIES</text>
  <text x="458" y="704" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#ffffff">NEW NIGHTS</text>

  <rect width="600" height="800" filter="url(#grain)" opacity=".07"/>
</svg>
