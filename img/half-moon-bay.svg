<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Half Moon Bay explore card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1030"/>
      <stop offset=".42" stop-color="#8a2e4a"/>
      <stop offset=".56" stop-color="#ff7a4a"/>
      <stop offset=".62" stop-color="#0d4a52"/>
      <stop offset="1" stop-color="#04222a"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffcf8a" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>

  <!-- name -->
  <text x="300" y="118" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="56" letter-spacing="8" fill="#fff4e8">HALF MOON BAY</text>
  <text x="300" y="160" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="17" letter-spacing="4" fill="#ffc9a8">DHAHRAN COAST</text>

  <!-- hero: setting sun over the crescent bay -->
  <ellipse cx="300" cy="470" rx="240" ry="170" fill="url(#sunGlow)"/>
  <circle cx="300" cy="470" r="88" fill="#ffdf9a"/>
  <rect x="180" y="470" width="240" height="90" fill="none"/>
  <!-- horizon -->
  <path d="M40 496h520" stroke="#ffdf9a" stroke-width="3" opacity=".8"/>
  <!-- sun reflection -->
  <g stroke="#ffcf8a" stroke-width="5" stroke-linecap="round" opacity=".75">
    <line x1="250" y1="520" x2="350" y2="520"/>
    <line x1="264" y1="544" x2="336" y2="544"/>
    <line x1="278" y1="568" x2="322" y2="568"/>
  </g>
  <!-- gentle waves -->
  <g stroke="#7adfd2" stroke-width="4" fill="none" stroke-linecap="round" opacity=".65">
    <path d="M80 600c30-14 60-14 90 0s60 14 90 0 60-14 90 0 60 14 90 0"/>
    <path d="M120 636c26-12 52-12 78 0s52 12 78 0 52-12 78 0 52 12 78 0" opacity=".7"/>
  </g>
  <!-- crescent beach arc -->
  <path d="M70 668c70-38 390-38 460 0" stroke="#ffe1b0" stroke-width="6" fill="none" stroke-linecap="round" opacity=".85"/>
  <!-- sailboat -->
  <g transform="translate(440 452)">
    <path d="M0 20h44l-8 10h-28z" fill="#2a1030"/>
    <path d="M20 18v-34l-20 34z" fill="#fff4e8"/>
    <path d="M24 18v-28l16 28z" fill="#ffdf9a"/>
  </g>
  <!-- gulls -->
  <g stroke="#fff4e8" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M150 350c8-8 16-8 22 0 6-8 14-8 22 0"/>
    <path d="M420 320c6-6 12-6 17 0 5-6 11-6 17 0"/>
  </g>

  <!-- thin divider -->
  <rect x="150" y="694" width="300" height="1.5" fill="#ffc9a8" opacity=".55"/>

  <!-- calm tagline, no date -->
  <text x="300" y="734" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="500" font-size="24" fill="#fff4e8">Golden sands, calm water</text>
  <g fill="none" stroke="#ffc9a8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M225 754c-7 0-12 5-12 12 0 9 12 21 12 21s12-12 12-21c0-7-5-12-12-12z"/>
    <circle cx="225" cy="766" r="3.5"/>
  </g>
  <text x="248" y="774" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="18" letter-spacing="3" fill="#ffc9a8">HALF MOON BAY</text>

  <rect width="600" height="800" filter="url(#grain)" opacity=".06"/>
</svg>
