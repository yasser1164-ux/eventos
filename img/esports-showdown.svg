<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Esports Showdown poster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08080f"/>
      <stop offset=".5" stop-color="#151530"/>
      <stop offset="1" stop-color="#07070d"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b4a"/>
      <stop offset="1" stop-color="#14142a"/>
    </linearGradient>
    <radialGradient id="crimGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff2d55" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ff2d55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#35d6ff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#35d6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>

  <!-- hex-grid backdrop -->
  <g stroke="#35d6ff" stroke-opacity=".08" fill="none" stroke-width="2">
    <path d="M60 320l30-18 30 18v36l-30 18-30-18z"/>
    <path d="M120 284l30-18 30 18v36l-30 18-30-18z"/>
    <path d="M480 300l30-18 30 18v36l-30 18-30-18z"/>
    <path d="M420 560l30-18 30 18v36l-30 18-30-18z"/>
    <path d="M90 540l30-18 30 18v36l-30 18-30-18z"/>
  </g>
  <ellipse cx="150" cy="90" rx="220" ry="150" fill="url(#crimGlow)" opacity=".6"/>
  <ellipse cx="470" cy="110" rx="220" ry="150" fill="url(#cyanGlow)"/>

  <!-- two-tone grunge title -->
  <g filter="url(#rough)">
    <text x="300" y="128" text-anchor="middle" font-family="'Arial Narrow','Oswald',Impact,'Helvetica Neue',sans-serif" font-weight="900" font-size="88" fill="#f2f4ff" textLength="440" lengthAdjust="spacingAndGlyphs">ESPORTS</text>
    <text x="300" y="192" text-anchor="middle" font-family="'Arial Narrow','Oswald',Impact,'Helvetica Neue',sans-serif" font-weight="900" font-size="56" fill="#ff2d55" textLength="400" lengthAdjust="spacingAndGlyphs">SHOWDOWN</text>
  </g>

  <!-- date line between thin rules + venue line -->
  <rect x="140" y="214" width="320" height="1.5" fill="#35d6ff" opacity=".55"/>
  <text x="300" y="242" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="22" letter-spacing="8" fill="#35d6ff">SATURDAY &#183; 7 PM</text>
  <rect x="140" y="254" width="320" height="1.5" fill="#35d6ff" opacity=".55"/>
  <text x="300" y="284" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="16" letter-spacing="5" fill="#c3c9e8">DHAHRAN EXPO</text>

  <!-- hero: controller -->
  <ellipse cx="300" cy="470" rx="250" ry="160" fill="url(#crimGlow)" opacity=".5"/>
  <g>
    <path d="M170 400c10-32 42-52 130-52s120 20 130 52c14 44 26 108 2 128-22 18-52-6-70-34-14-22-34-26-62-26s-48 4-62 26c-18 28-48 52-70 34-24-20-12-84 2-128z" fill="url(#pad)" stroke="#35d6ff" stroke-width="5"/>
    <g stroke="#35d6ff" stroke-width="8" stroke-linecap="round">
      <line x1="228" y1="418" x2="228" y2="462"/>
      <line x1="206" y1="440" x2="250" y2="440"/>
    </g>
    <g fill="#ff2d55">
      <circle cx="352" cy="420" r="11"/>
      <circle cx="392" cy="440" r="11"/>
    </g>
    <g fill="#35d6ff">
      <circle cx="372" cy="462" r="11"/>
      <circle cx="372" cy="398" r="11"/>
    </g>
    <circle cx="300" cy="470" r="13" fill="none" stroke="#ff2d55" stroke-width="4"/>
  </g>
  <g stroke="#ff2d55" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7">
    <path d="M158 356a190 190 0 0 1 60-40"/>
    <path d="M442 356a190 190 0 0 0-60-40"/>
  </g>

  <!-- divider -->
  <rect x="40" y="650" width="520" height="2" fill="#ff2d55" opacity=".5"/>

  <!-- three-segment info strip -->
  <g fill="none" stroke="#ff2d55" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="42" y="676" width="22" height="20" rx="3"/>
    <line x1="42" y1="683" x2="64" y2="683"/>
    <line x1="48" y1="672" x2="48" y2="679"/>
    <line x1="58" y1="672" x2="58" y2="679"/>
  </g>
  <text x="74" y="684" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="14" letter-spacing="1" fill="#ff2d55">SATURDAY</text>
  <text x="74" y="704" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#ffffff">7:00 PM</text>

  <rect x="203" y="668" width="1.5" height="42" fill="#ff2d55" opacity=".35"/>

  <g fill="none" stroke="#ff2d55" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M232 672c-8 0-14 6-14 14 0 10 14 24 14 24s14-14 14-24c0-8-6-14-14-14z"/>
    <circle cx="232" cy="686" r="4"/>
  </g>
  <text x="258" y="684" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="14" letter-spacing="1" fill="#ff2d55">DHAHRAN</text>
  <text x="258" y="704" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#ffffff">EXPO</text>

  <rect x="408" y="668" width="1.5" height="42" fill="#ff2d55" opacity=".35"/>

  <g stroke="#ff2d55" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M424 682c2-6 26-6 28 0 3 8 5 16 0 18-4 2-7-4-9-6h-10c-2 2-5 8-9 6-5-2-3-10 0-18z"/>
  </g>
  <text x="458" y="684" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="14" letter-spacing="1" fill="#ff2d55">LEVEL UP</text>
  <text x="458" y="704" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#ffffff">PLAY LIVE</text>

  <rect width="600" height="800" filter="url(#grain)" opacity=".07"/>
</svg>
