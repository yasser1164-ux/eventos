<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Tarout Island explore card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160f1e"/>
      <stop offset=".5" stop-color="#3a2438"/>
      <stop offset="1" stop-color="#120b16"/>
    </linearGradient>
    <radialGradient id="bronzeGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e0a96a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#e0a96a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c4030"/>
      <stop offset="1" stop-color="#33221a"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>

  <!-- crescent + stars -->
  <path d="M500 214a38 38 0 1 0 19 64 31 31 0 1 1-19-64z" fill="#f2ddb8" opacity=".9"/>
  <g fill="#e8cfa0" opacity=".7">
    <circle cx="100" cy="90" r="2.5"/>
    <circle cx="170" cy="140" r="2"/>
    <circle cx="420" cy="80" r="2"/>
  </g>

  <!-- name -->
  <text x="300" y="118" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="56" letter-spacing="8" fill="#f7ecda">TAROUT ISLAND</text>
  <text x="300" y="160" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="17" letter-spacing="4" fill="#c9a380">QATIF &#183; 5,000 YEARS OF HISTORY</text>

  <!-- hero: hilltop castle over water -->
  <ellipse cx="300" cy="450" rx="250" ry="170" fill="url(#bronzeGlow)"/>
  <!-- hill -->
  <path d="M110 600c40-60 120-100 190-100s150 40 190 100z" fill="#241710"/>
  <!-- castle towers -->
  <g fill="url(#stone2)" stroke="#e0a96a" stroke-width="3">
    <path d="M220 500v-120c0-30 18-52 40-52s40 22 40 52v120z" transform="translate(-46 0)"/>
    <path d="M220 500v-90c0-24 14-40 32-40s32 16 32 40v90z" transform="translate(94 0)"/>
    <rect x="252" y="420" width="96" height="80"/>
  </g>
  <!-- crenellations + windows -->
  <g fill="#e0a96a">
    <rect x="250" y="412" width="14" height="10"/>
    <rect x="292" y="412" width="14" height="10"/>
    <rect x="334" y="412" width="14" height="10"/>
    <rect x="206" y="320" width="6" height="10"/>
    <rect x="222" y="316" width="6" height="12"/>
    <rect x="238" y="320" width="6" height="10"/>
  </g>
  <g fill="#120b16" stroke="#e0a96a" stroke-width="2">
    <path d="M214 420v-24c0-8 5-14 12-14s12 6 12 14v24z"/>
    <path d="M334 430v-20c0-7 5-12 11-12s11 5 11 12v20z"/>
    <path d="M286 500v-34c0-10 6-17 14-17s14 7 14 17v34z"/>
  </g>
  <!-- palm -->
  <g stroke="#2e1d14" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M436 566c2-30 8-50 18-64"/>
  </g>
  <g stroke="#b98a54" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M454 502c-18-10-34-8-44 2"/>
    <path d="M454 502c-2-18 6-30 16-36"/>
    <path d="M454 502c16-12 30-10 40 0"/>
  </g>
  <!-- water -->
  <g stroke="#7a6a94" stroke-width="4" fill="none" stroke-linecap="round" opacity=".6">
    <path d="M110 632c26-12 52-12 78 0s52 12 78 0 52-12 78 0 52 12 78 0"/>
    <path d="M160 662c22-10 44-10 66 0s44 10 66 0 44-10 66 0" opacity=".7"/>
  </g>

  <!-- thin divider -->
  <rect x="150" y="694" width="300" height="1.5" fill="#c9a380" opacity=".5"/>

  <!-- calm tagline, no date -->
  <text x="300" y="734" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="500" font-size="24" fill="#f7ecda">Walk through five millennia</text>
  <g fill="none" stroke="#c9a380" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M254 754c-7 0-12 5-12 12 0 9 12 21 12 21s12-12 12-21c0-7-5-12-12-12z"/>
    <circle cx="254" cy="766" r="3.5"/>
  </g>
  <text x="277" y="774" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="18" letter-spacing="3" fill="#c9a380">QATIF</text>

  <rect width="600" height="800" filter="url(#grain)" opacity=".06"/>
</svg>
