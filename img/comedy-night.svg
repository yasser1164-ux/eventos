<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Comedy Night poster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0903"/>
      <stop offset=".5" stop-color="#1c1207"/>
      <stop offset="1" stop-color="#0a0703"/>
    </linearGradient>
    <radialGradient id="spot" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="micHead" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#fff3d0"/>
      <stop offset=".55" stop-color="#ffcf5c"/>
      <stop offset="1" stop-color="#8a6a14"/>
    </radialGradient>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>

  <!-- spotlight cone -->
  <polygon points="250,0 350,0 430,600 170,600" fill="#ffe9b0" opacity=".07"/>
  <ellipse cx="300" cy="120" rx="240" ry="150" fill="url(#spot)" opacity=".4"/>

  <!-- two-tone grunge title -->
  <g filter="url(#rough)">
    <text x="300" y="128" text-anchor="middle" font-family="'Arial Narrow','Oswald',Impact,'Helvetica Neue',sans-serif" font-weight="900" font-size="90" fill="#ffcf5c" textLength="440" lengthAdjust="spacingAndGlyphs">COMEDY</text>
    <text x="300" y="192" text-anchor="middle" font-family="'Arial Narrow','Oswald',Impact,'Helvetica Neue',sans-serif" font-weight="900" font-size="56" fill="#fff6e3" textLength="260" lengthAdjust="spacingAndGlyphs">NIGHT</text>
  </g>

  <!-- date line between thin rules + venue line -->
  <rect x="140" y="214" width="320" height="1.5" fill="#ffcf5c" opacity=".55"/>
  <text x="300" y="242" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="22" letter-spacing="8" fill="#ffcf5c">FRIDAY &#183; 9:00 PM</text>
  <rect x="140" y="254" width="320" height="1.5" fill="#ffcf5c" opacity=".55"/>
  <text x="300" y="284" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="16" letter-spacing="5" fill="#e8d9b8">AJDAN WALK &#183; AL KHOBAR</text>

  <!-- hero: mic in spotlight -->
  <ellipse cx="300" cy="480" rx="230" ry="150" fill="url(#spot)" opacity=".5"/>
  <g stroke="#caa64f" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="300" y1="430" x2="300" y2="596"/>
    <line x1="258" y1="620" x2="342" y2="620"/>
    <line x1="300" y1="596" x2="300" y2="620"/>
  </g>
  <rect x="284" y="404" width="32" height="40" rx="10" fill="#caa64f"/>
  <circle cx="300" cy="380" r="46" fill="url(#micHead)"/>
  <g stroke="#7a5c10" stroke-width="2.5" opacity=".8">
    <line x1="262" y1="366" x2="338" y2="366"/>
    <line x1="258" y1="382" x2="342" y2="382"/>
    <line x1="264" y1="398" x2="336" y2="398"/>
  </g>
  <g fill="#ffcf5c">
    <polygon points="170,360 176,374 190,378 176,382 170,396 164,382 150,378 164,374"/>
    <polygon points="432,420 437,431 448,434 437,437 432,448 427,437 416,434 427,431"/>
    <polygon points="404,318 408,327 417,330 408,333 404,342 400,333 391,330 400,327"/>
  </g>

  <!-- divider -->
  <rect x="40" y="650" width="520" height="2" fill="#ffcf5c" opacity=".5"/>

  <!-- three-segment info strip -->
  <g fill="none" stroke="#ffcf5c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="42" y="676" width="22" height="20" rx="3"/>
    <line x1="42" y1="683" x2="64" y2="683"/>
    <line x1="48" y1="672" x2="48" y2="679"/>
    <line x1="58" y1="672" x2="58" y2="679"/>
  </g>
  <text x="74" y="684" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="14" letter-spacing="1" fill="#ffcf5c">FRIDAY</text>
  <text x="74" y="704" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#ffffff">9:00 PM</text>

  <rect x="203" y="668" width="1.5" height="42" fill="#ffcf5c" opacity=".35"/>

  <g fill="none" stroke="#ffcf5c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M232 672c-8 0-14 6-14 14 0 10 14 24 14 24s14-14 14-24c0-8-6-14-14-14z"/>
    <circle cx="232" cy="686" r="4"/>
  </g>
  <text x="258" y="684" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="14" letter-spacing="1" fill="#ffcf5c">AJDAN WALK</text>
  <text x="258" y="704" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#ffffff">AL KHOBAR</text>

  <rect x="408" y="668" width="1.5" height="42" fill="#ffcf5c" opacity=".35"/>

  <g stroke="#ffcf5c" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="434" cy="682" r="9"/>
    <line x1="434" y1="691" x2="434" y2="700"/>
    <line x1="427" y1="700" x2="441" y2="700"/>
  </g>
  <text x="458" y="684" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="14" letter-spacing="1" fill="#ffcf5c">ONE MIC</text>
  <text x="458" y="704" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#ffffff">BIG LAUGHS</text>

  <rect width="600" height="800" filter="url(#grain)" opacity=".07"/>
</svg>
