<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Marjan Island explore card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03202a"/>
      <stop offset=".5" stop-color="#0a3d4a"/>
      <stop offset="1" stop-color="#021a22"/>
    </linearGradient>
    <radialGradient id="seaGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3ddfae" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3ddfae" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#fdfef0"/>
      <stop offset="1" stop-color="#cfe0c8"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>

  <circle cx="470" cy="230" r="42" fill="url(#moon)" opacity=".9"/>
  <g fill="#d8f5ea" opacity=".7">
    <circle cx="110" cy="210" r="2.5"/>
    <circle cx="180" cy="250" r="2"/>
    <circle cx="520" cy="320" r="2"/>
  </g>

  <!-- name -->
  <text x="300" y="118" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="56" letter-spacing="8" fill="#effff8">MARJAN ISLAND</text>
  <text x="300" y="160" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="17" letter-spacing="4" fill="#8fd0b8">DAMMAM CORNICHE</text>

  <!-- hero: island with palms, causeway into the sea -->
  <ellipse cx="300" cy="480" rx="260" ry="180" fill="url(#seaGlow)"/>
  <!-- causeway arc from shore to island -->
  <path d="M60 640c80-60 150-92 240-96" stroke="#3ddfae" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7" stroke-dasharray="2 14"/>
  <!-- island mound -->
  <path d="M180 560c20-36 60-58 120-58s100 22 120 58c8 16-2 24-18 24H198c-16 0-26-8-18-24z" fill="#0d5a4a" stroke="#3ddfae" stroke-width="4"/>
  <!-- palms -->
  <g stroke="#0a3d33" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M258 502c-2-34 4-56 14-72"/>
    <path d="M338 508c4-30 0-52-8-68"/>
  </g>
  <g stroke="#3ddfae" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M272 430c-24-12-42-8-54 4"/>
    <path d="M272 430c-4-24 6-38 20-44"/>
    <path d="M272 430c22-14 38-12 50 0"/>
    <path d="M330 440c-22-10-38-6-48 6"/>
    <path d="M330 440c-2-22 8-34 20-40"/>
    <path d="M330 440c20-12 36-10 46 2"/>
  </g>
  <!-- water lines -->
  <g stroke="#7adfd2" stroke-width="4" fill="none" stroke-linecap="round" opacity=".6">
    <path d="M110 630c26-12 52-12 78 0s52 12 78 0 52-12 78 0 52 12 78 0"/>
    <path d="M150 662c22-10 44-10 66 0s44 10 66 0 44-10 66 0" opacity=".7"/>
  </g>
  <!-- gulls -->
  <g stroke="#effff8" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M170 330c8-8 16-8 22 0 6-8 14-8 22 0"/>
    <path d="M410 370c6-6 12-6 17 0 5-6 11-6 17 0"/>
  </g>

  <!-- thin divider -->
  <rect x="150" y="694" width="300" height="1.5" fill="#8fd0b8" opacity=".5"/>

  <!-- calm tagline, no date -->
  <text x="300" y="734" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="500" font-size="24" fill="#effff8">A walk into the sea</text>
  <g fill="none" stroke="#8fd0b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M248 754c-7 0-12 5-12 12 0 9 12 21 12 21s12-12 12-21c0-7-5-12-12-12z"/>
    <circle cx="248" cy="766" r="3.5"/>
  </g>
  <text x="271" y="774" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="18" letter-spacing="3" fill="#8fd0b8">DAMMAM</text>

  <rect width="600" height="800" filter="url(#grain)" opacity=".06"/>
</svg>
