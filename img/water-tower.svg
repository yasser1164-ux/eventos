<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Khobar Water Tower explore card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#170f30"/>
      <stop offset=".45" stop-color="#3a1e4a"/>
      <stop offset=".62" stop-color="#7a3a52"/>
      <stop offset=".72" stop-color="#1a1030"/>
      <stop offset="1" stop-color="#0c081c"/>
    </linearGradient>
    <radialGradient id="sunset" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff8a6a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff8a6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#241536"/>
      <stop offset="1" stop-color="#120a20"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>

  <!-- dusk glow at horizon -->
  <ellipse cx="300" cy="500" rx="320" ry="180" fill="url(#sunset)"/>
  <g fill="#ffe1c8" opacity=".8">
    <circle cx="100" cy="90" r="2.5"/>
    <circle cx="500" cy="70" r="2"/>
    <circle cx="450" cy="160" r="2"/>
    <circle cx="140" cy="200" r="2"/>
  </g>

  <!-- name -->
  <text x="300" y="120" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="58" letter-spacing="10" fill="#fdf2ec">WATER TOWER</text>
  <text x="300" y="162" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="17" letter-spacing="4" fill="#d9a8b8">AL KHOBAR LANDMARK</text>

  <!-- hero: tower silhouette above the bay -->
  <g>
    <!-- flared cap -->
    <path d="M170 360c30-34 82-54 130-54s100 20 130 54c8 10 4 22-10 22h-240c-14 0-18-12-10-22z" fill="url(#tower)" stroke="#ff8a6a" stroke-width="3"/>
    <!-- observation ring lights -->
    <g fill="#ffcf8a">
      <circle cx="210" cy="368" r="4"/>
      <circle cx="255" cy="360" r="4"/>
      <circle cx="300" cy="357" r="4"/>
      <circle cx="345" cy="360" r="4"/>
      <circle cx="390" cy="368" r="4"/>
    </g>
    <!-- stem -->
    <path d="M270 382h60l-14 190h-32z" fill="url(#tower)" stroke="#ff8a6a" stroke-width="3"/>
    <!-- base -->
    <path d="M240 596c18-16 102-16 120 0z" fill="url(#tower)" stroke="#ff8a6a" stroke-width="3"/>
  </g>
  <!-- water + reflection -->
  <path d="M40 596h520" stroke="#ff8a6a" stroke-width="2.5" opacity=".7"/>
  <g stroke="#ff9a7a" stroke-width="3" stroke-linecap="round" opacity=".5">
    <line x1="270" y1="616" x2="330" y2="616"/>
    <line x1="282" y1="632" x2="318" y2="632"/>
    <line x1="292" y1="648" x2="308" y2="648"/>
  </g>

  <!-- thin divider -->
  <rect x="150" y="694" width="300" height="1.5" fill="#d9a8b8" opacity=".5"/>

  <!-- calm tagline, no date -->
  <text x="300" y="734" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="500" font-size="24" fill="#fdf2ec">The icon above the bay</text>
  <g fill="none" stroke="#d9a8b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M236 754c-7 0-12 5-12 12 0 9 12 21 12 21s12-12 12-21c0-7-5-12-12-12z"/>
    <circle cx="236" cy="766" r="3.5"/>
  </g>
  <text x="259" y="774" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="18" letter-spacing="3" fill="#d9a8b8">AL KHOBAR</text>

  <rect width="600" height="800" filter="url(#grain)" opacity=".06"/>
</svg>
