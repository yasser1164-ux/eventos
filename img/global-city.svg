<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Global City Dammam poster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e24"/>
      <stop offset=".5" stop-color="#182048"/>
      <stop offset="1" stop-color="#080c1e"/>
    </linearGradient>
    <radialGradient id="coralGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff6b5e" stop-opacity=".4"/>
      <stop offset="1" stop-color="#ff6b5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="globe" cx=".35" cy=".3" r=".95">
      <stop offset="0" stop-color="#7ec8ff"/>
      <stop offset=".65" stop-color="#2f7fd4"/>
      <stop offset="1" stop-color="#123a72"/>
    </radialGradient>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>

  <ellipse cx="150" cy="100" rx="220" ry="150" fill="url(#coralGlow)"/>
  <ellipse cx="460" cy="120" rx="220" ry="150" fill="url(#coralGlow)" opacity=".7"/>

  <!-- two-tone grunge title -->
  <g filter="url(#rough)">
    <text x="300" y="128" text-anchor="middle" font-family="'Arial Narrow','Oswald',Impact,'Helvetica Neue',sans-serif" font-weight="900" font-size="80" fill="#f4f6ff" textLength="520" lengthAdjust="spacingAndGlyphs">GLOBAL CITY</text>
    <text x="300" y="192" text-anchor="middle" font-family="'Arial Narrow','Oswald',Impact,'Helvetica Neue',sans-serif" font-weight="900" font-size="56" fill="#ff6b5e" textLength="300" lengthAdjust="spacingAndGlyphs">DAMMAM</text>
  </g>

  <!-- date line between thin rules + venue line -->
  <rect x="140" y="214" width="320" height="1.5" fill="#ff6b5e" opacity=".55"/>
  <text x="300" y="242" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="22" letter-spacing="8" fill="#ff6b5e">DAILY &#183; 4 PM&#8211;12 AM</text>
  <rect x="140" y="254" width="320" height="1.5" fill="#ff6b5e" opacity=".55"/>
  <text x="300" y="284" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="16" letter-spacing="5" fill="#c9d0ee">FLAVORS &amp; SHOWS FROM EVERYWHERE</text>

  <!-- hero: globe under a string of pennant flags -->
  <path d="M80 320q220 90 440 0" stroke="#8a93c8" stroke-width="3" fill="none"/>
  <g>
    <polygon points="130,332 156,338 134,356" fill="#ff6b5e"/>
    <polygon points="210,352 236,356 216,374" fill="#ffd166"/>
    <polygon points="292,360 318,362 298,382" fill="#4be3a0"/>
    <polygon points="372,352 398,348 382,370" fill="#7ec8ff"/>
    <polygon points="452,334 476,326 462,348" fill="#c58aff"/>
  </g>
  <ellipse cx="300" cy="500" rx="240" ry="150" fill="url(#coralGlow)" opacity=".6"/>
  <circle cx="300" cy="490" r="120" fill="url(#globe)"/>
  <g stroke="#dceaff" stroke-width="3" fill="none" opacity=".75">
    <ellipse cx="300" cy="490" rx="120" ry="120"/>
    <ellipse cx="300" cy="490" rx="60" ry="120"/>
    <line x1="180" y1="490" x2="420" y2="490"/>
    <path d="M196 428a150 150 0 0 1 208 0"/>
    <path d="M196 552a150 150 0 0 0 208 0"/>
  </g>
  <g fill="#eafff4" opacity=".9">
    <path d="M250 452c14-10 34-12 44 0 8 10 0 22-12 24s-24 8-30-2c-5-9-8-16-2-22z"/>
    <path d="M330 512c12-6 26-4 32 6 5 9-2 18-12 20s-22-2-24-10 0-13 4-16z"/>
  </g>

  <!-- divider -->
  <rect x="40" y="650" width="520" height="2" fill="#ff6b5e" opacity=".5"/>

  <!-- three-segment info strip -->
  <g fill="none" stroke="#ff6b5e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="42" y="676" width="22" height="20" rx="3"/>
    <line x1="42" y1="683" x2="64" y2="683"/>
    <line x1="48" y1="672" x2="48" y2="679"/>
    <line x1="58" y1="672" x2="58" y2="679"/>
  </g>
  <text x="74" y="684" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="14" letter-spacing="1" fill="#ff6b5e">DAILY</text>
  <text x="74" y="704" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#ffffff">4 PM&#8211;12 AM</text>

  <rect x="203" y="668" width="1.5" height="42" fill="#ff6b5e" opacity=".35"/>

  <g fill="none" stroke="#ff6b5e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M232 672c-8 0-14 6-14 14 0 10 14 24 14 24s14-14 14-24c0-8-6-14-14-14z"/>
    <circle cx="232" cy="686" r="4"/>
  </g>
  <text x="258" y="684" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="14" letter-spacing="1" fill="#ff6b5e">GLOBAL CITY</text>
  <text x="258" y="704" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#ffffff">DAMMAM</text>

  <rect x="408" y="668" width="1.5" height="42" fill="#ff6b5e" opacity=".35"/>

  <g stroke="#ff6b5e" stroke-width="2.5" fill="none">
    <circle cx="434" cy="688" r="13"/>
    <ellipse cx="434" cy="688" rx="6" ry="13"/>
    <line x1="421" y1="688" x2="447" y2="688"/>
  </g>
  <text x="458" y="684" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="14" letter-spacing="1" fill="#ff6b5e">ONE WORLD</text>
  <text x="458" y="704" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#ffffff">ONE CITY</text>

  <rect width="600" height="800" filter="url(#grain)" opacity=".07"/>
</svg>
