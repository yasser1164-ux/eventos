<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Open-Air Cinema poster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050a18"/>
      <stop offset=".5" stop-color="#0e1a36"/>
      <stop offset="1" stop-color="#040812"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e3"/>
      <stop offset="1" stop-color="#ffddad"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
    </radialGradient>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#dce7ff" opacity=".8">
    <circle cx="80" cy="80" r="2.5"/>
    <circle cx="180" cy="50" r="2"/>
    <circle cx="480" cy="70" r="2.5"/>
    <circle cx="530" cy="140" r="2"/>
    <circle cx="60" cy="180" r="2"/>
    <circle cx="410" cy="120" r="1.8"/>
  </g>

  <!-- two-tone grunge title -->
  <g filter="url(#rough)">
    <text x="300" y="128" text-anchor="middle" font-family="'Arial Narrow','Oswald',Impact,'Helvetica Neue',sans-serif" font-weight="900" font-size="84" fill="#f2f6ff" textLength="440" lengthAdjust="spacingAndGlyphs">OPEN-AIR</text>
    <text x="300" y="192" text-anchor="middle" font-family="'Arial Narrow','Oswald',Impact,'Helvetica Neue',sans-serif" font-weight="900" font-size="56" fill="#ffddad" textLength="300" lengthAdjust="spacingAndGlyphs">CINEMA</text>
  </g>

  <!-- date line between thin rules + venue line -->
  <rect x="140" y="214" width="320" height="1.5" fill="#ffddad" opacity=".55"/>
  <text x="300" y="242" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="22" letter-spacing="8" fill="#ffddad">THU&#8211;SAT &#183; 8 PM</text>
  <rect x="140" y="254" width="320" height="1.5" fill="#ffddad" opacity=".55"/>
  <text x="300" y="284" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="16" letter-spacing="5" fill="#c9d4ee">KHOBAR SEA FRONT</text>

  <!-- hero: projector beam onto glowing screen -->
  <polygon points="300,610 160,352 440,352" fill="#ffe9b0" opacity=".10"/>
  <ellipse cx="300" cy="380" rx="240" ry="140" fill="url(#warmGlow)" opacity=".55"/>
  <rect x="150" y="330" width="300" height="180" rx="10" fill="url(#screen)"/>
  <rect x="150" y="330" width="300" height="180" rx="10" fill="none" stroke="#0a1226" stroke-width="6"/>
  <!-- play glyph on screen -->
  <polygon points="282,392 282,448 330,420" fill="#0e1a36" opacity=".85"/>
  <!-- palms flanking the screen -->
  <g stroke="#0a1430" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="118" y1="600" x2="122" y2="500"/>
    <line x1="482" y1="600" x2="478" y2="500"/>
  </g>
  <g stroke="#12224a" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M122 500c-26-16-44-12-58 2"/>
    <path d="M122 500c-8-26 2-42 18-50"/>
    <path d="M122 500c22-18 40-16 54-4"/>
    <path d="M478 500c26-16 44-12 58 2"/>
    <path d="M478 500c8-26-2-42-18-50"/>
    <path d="M478 500c-22-18-40-16-54-4"/>
  </g>
  <!-- projector -->
  <rect x="272" y="586" width="56" height="30" rx="8" fill="#1a2a52" stroke="#ffddad" stroke-width="3"/>
  <circle cx="300" cy="601" r="7" fill="#ffe9b0"/>

  <!-- divider -->
  <rect x="40" y="650" width="520" height="2" fill="#ffddad" opacity=".5"/>

  <!-- three-segment info strip -->
  <g fill="none" stroke="#ffddad" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="42" y="676" width="22" height="20" rx="3"/>
    <line x1="42" y1="683" x2="64" y2="683"/>
    <line x1="48" y1="672" x2="48" y2="679"/>
    <line x1="58" y1="672" x2="58" y2="679"/>
  </g>
  <text x="74" y="684" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="14" letter-spacing="1" fill="#ffddad">THU&#8211;SAT</text>
  <text x="74" y="704" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#ffffff">8:00 PM</text>

  <rect x="203" y="668" width="1.5" height="42" fill="#ffddad" opacity=".35"/>

  <g fill="none" stroke="#ffddad" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M232 672c-8 0-14 6-14 14 0 10 14 24 14 24s14-14 14-24c0-8-6-14-14-14z"/>
    <circle cx="232" cy="686" r="4"/>
  </g>
  <text x="258" y="684" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="14" letter-spacing="1" fill="#ffddad">SEA FRONT</text>
  <text x="258" y="704" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#ffffff">AL KHOBAR</text>

  <rect x="408" y="668" width="1.5" height="42" fill="#ffddad" opacity=".35"/>

  <g stroke="#ffddad" stroke-width="2.5" fill="none" stroke-linejoin="round">
    <rect x="422" y="678" width="24" height="16" rx="3"/>
    <path d="M422 682l24-8"/>
  </g>
  <text x="458" y="684" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="14" letter-spacing="1" fill="#ffddad">MOVIES</text>
  <text x="458" y="704" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#ffffff">UNDER STARS</text>

  <rect width="600" height="800" filter="url(#grain)" opacity=".07"/>
</svg>
