<div class="wrap section-tight">
  <div id="board">
    <div class="section-head">
      <div>
        <h1 data-i18n="reqs.h1">الطلبات المفتوحة</h1>
        <p data-i18n="reqs.sub">مشترون يدوّرون على قطع الآن. كل طلب تقدر ترد عليه بعرض سعر — وأول عرض واضح غالباً يكسب.</p>
      </div>
      <a class="btn btn-primary" href="request.html" data-i18n="reqs.cta">اطلب قطعة أنت</a>
    </div>

    <div class="card pad" style="margin-bottom:18px">
      <div class="form-grid" style="gap:0 12px">
        <div class="field"><label data-i18n="f.city">المدينة</label><select id="b-city"></select></div>
        <div class="field"><label data-i18n="f.make">الماركة</label><select id="b-make"></select></div>
        <div class="field"><label data-i18n="f.category">القسم</label><select id="b-cat"></select></div>
        <div class="field"><label data-i18n="f.q2">بحث</label><input id="b-q" type="search" placeholder="اسم القطعة…" data-i18n-ph="f.q2.ph"></div>
      </div>
      <span class="muted num" id="board-count"></span>
    </div>

    <div class="grid grid-2" id="req-list"></div>

    <div class="cta-band" style="margin-top:34px">
      <div>
        <h2 data-i18n="reqs.band.t">تبي تشوف الطلبات أول بأول؟</h2>
        <p data-i18n="reqs.band.b">البائعون المشتركون يوصلهم تنبيه فوري بكل طلب جديد في مدينتهم — والسرعة هنا تعني بيعة.</p>
      </div>
      <a class="btn btn-primary btn-lg" href="pricing.html" data-i18n="reqs.band.cta">شوف الباقات</a>
    </div>
  </div>

  <div id="detail" hidden></div>
</div>
